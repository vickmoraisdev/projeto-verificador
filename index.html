<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Verificador</title>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <main>
        <section> <!--sessao de dados-->
            <p>
                Ano de nascimento: <input type="number" id="txtano">
            </p>
            <p>
                Sexo:
                <input type="radio" name="radsex" id="masc" checked>
                <label for="masc">Masculino</label>
                <input type="radio" name="radsex" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" value="Verificar" onclick="resultado()">
            </p>
        </section>

        <section> <!--sessao resultado-->
            <p id="res">
                Preencha os dados acima para ver o resultado!
            </p>
        </section>
    </main>
    <footer>
        <p>Criado por: <a href="https://github.com/vickmoraisdev" target="_blank">Vitória de Morais</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
